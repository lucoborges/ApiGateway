name: Testes e Deploy

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # Roda em máquina do GitHub (não no servidor): compila e executa os testes em todo push e pull request
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Testes
        run: dotnet test tests/GatewayAPI.Tests --nologo

  # Roda no servidor, só em push na master e só se os testes passarem
  deploy:
    needs: testes
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: self-hosted
    concurrency: deploy-producao
    steps:
      - uses: actions/checkout@v4
      - name: Publicar, trocar e verificar
        shell: powershell
        run: |
          $versao = "${{ github.sha }}".Substring(0, 7)
          & .\deploy\deploy.ps1 -Versao $versao
          exit $LASTEXITCODE
